name: nightly heavy-suite

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  heavy-quality:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.17

      - name: Configure Composer Auth
        if: ${{ secrets.FLUXUI_PRO_USERNAME != '' && secrets.FLUXUI_PRO_KEY != '' }}
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUXUI_PRO_USERNAME }}" "${{ secrets.FLUXUI_PRO_KEY }}"

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          bun install --frozen-lockfile

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=BasePlatformSeeder

      - name: Run Heavy Tier Workflow
        run: composer workflow:heavy

      - name: Run Policy Checksum Monitor
        run: php artisan policy:checksum-monitor
