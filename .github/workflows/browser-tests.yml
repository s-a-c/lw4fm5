name: browser-tests

on:
  push:
    branches:
      - pest-ci
      - develop
      - main
  pull_request:
    branches:
      - pest-ci
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.17

      - name: Configure Composer Auth
        env:
          FLUXUI_PRO_USERNAME: ${{ secrets.FLUXUI_PRO_USERNAME }}
          FLUXUI_PRO_KEY: ${{ secrets.FLUXUI_PRO_KEY }}
        run: |
          if [[ -z "$FLUXUI_PRO_USERNAME" || -z "$FLUXUI_PRO_KEY" ]]; then
            echo "::error::Missing FLUXUI_PRO_USERNAME and FLUXUI_PRO_KEY secrets required for composer.fluxui.dev"
            exit 1
          fi

          composer config http-basic.composer.fluxui.dev "$FLUXUI_PRO_USERNAME" "$FLUXUI_PRO_KEY"

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          bun install --frozen-lockfile

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Setup Test Environment
        run: |
          cp vendor/laravel-labs/starter-kit-browser-tests/phpunit.xml.dist .
          rm phpunit.xml
          rm -Rf tests/
          cp -rf vendor/laravel-labs/starter-kit-browser-tests/tests/ tests/

      - name: Build Assets
        run: bun run build

      - name: Tests
        run: php vendor/bin/pest
